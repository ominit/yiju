{% macro icon(name) %}
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    {% if name == 'flag' %}
      <path d="M5 21V4m0 0c5-4 9 4 14 0v10c-5 4-9-4-14 0" />
    {% elif name == 'audio' %}
      <path d="m11 4-6 5H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
    {% elif name == 'muted' %}
      <path d="m11 4-6 5H2v6h3l6 5V4Zm5 5 6 6m0-6-6 6" />
    {% elif name == 'replay' %}
      <path d="m9 5-4 4H2v6h3l4 4V5Z" />
      <path d="M14 9a5 5 0 1 1-1 6M14 5v4h4" />
    {% elif name == 'undo' %}
      <path d="M8 5 3 10l5 5m-5-5h12a6 6 0 0 1 0 12" />
    {% elif name == 'previous' %}
      <path d="m14 5-7 7 7 7" />
    {% elif name == 'next' %}
      <path d="m10 5 7 7-7 7" />
    {% elif name == 'erase' %}
      <path d="m16 3 5 5a2 2 0 0 1 0 3l-8 9H7l-4-4a2 2 0 0 1 0-3L13 3a2 2 0 0 1 3 0ZM8 8l8 8M7 20h14" />
    {% endif %}
  </svg>
{% endmacro %}
{% macro review_undo(review, csrf) %}
  <form method="post"
        action="{{ url_for('actions.undo') }}"
        data-study-undo
        {% if not review %}hidden{% endif %}>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden"
           name="review_id"
           value="{{ review.id if review else '' }}">
    <button class="text-button review-undo"
            type="submit"
            aria-label="Undo last review"
            title="Undo last review">
      {{ icon("undo") }}
      <span>Undo last review</span>
    </button>
  </form>
{% endmacro %}
{% macro flag(word, flagged, csrf) %}
  <button type="button"
          class="icon-button flag-button"
          data-flag-word="{{ word }}"
          data-csrf="{{ csrf }}"
          aria-pressed="{{ 'true' if flagged else 'false' }}"
          aria-label="{{ 'Unflag' if flagged else 'Flag' }} {{ word }}"
          title="{{ 'Unflag' if flagged else 'Flag for correction' }} {{ word }}">{{ icon("flag") }}</button>
{% endmacro %}
