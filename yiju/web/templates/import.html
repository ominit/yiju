{% extends 'base.html' %}
{% block title %}Import words · Yiju{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
  <div class="page-heading">
    <h1>Import words</h1>
  </div>
  <form class="panel import-form"
        method="post"
        enctype="multipart/form-data"
        data-busy>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="upload-area" for="file">
      <strong>Pleco XML export</strong>
      <input id="file"
             name="file"
             type="file"
             accept=".xml,text/xml,application/xml"
             required>
    </label>
    <button class="button" type="submit">Import</button>
    <p class="busy-message" role="status" hidden>Importing…</p>
  </form>
{% endblock %}
