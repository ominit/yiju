{% extends 'base.html' %}
{% from 'macros/ui.html' import icon %}
{% block title %}Import · Yiju{% endblock %}
{% block main_class %}page narrow{% endblock %}
{% block content %}
  <a class="back" href="{{ url_for('pages.library') }}">{{ icon('back', 18) }}Library</a>
  <header class="page-head">
    <h1>Import words</h1>
  </header>
  <form class="panel import"
        method="post"
        enctype="multipart/form-data"
        data-busy="Importing…">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="dropzone" data-dropzone>
      {{ icon('upload', 28) }}
      <span class="dropzone-title" data-file-name>Choose a Pleco XML export</span>
      <span class="muted small">In Pleco: Flashcards → Import/Export → Export cards, format XML</span>
      <input name="file"
             type="file"
             accept=".xml,text/xml,application/xml"
             required>
    </label>
    <div class="form-actions">
      <button class="button primary" type="submit">Import</button>
    </div>
  </form>
{% endblock %}
